services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fixkosten}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      POSTGRES_DB: ${DB_NAME:-fixkosten}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixkosten} -d ${DB_NAME:-fixkosten}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-fixkosten}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-fixkosten}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TZ: ${TZ:-Europe/Berlin}
      REMINDERS_CRON: ${REMINDERS_CRON:-0 7 * * *}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase.json:ro
    ports:
      # Nur lokal erreichbar; nach außen über den Reverse Proxy (Caddy/Nginx/Traefik)
      - "127.0.0.1:5000:5000"

volumes:
  db-data:
