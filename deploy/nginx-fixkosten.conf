# Host-Nginx (außerhalb von Docker) für fixkosten.guita.dev → web-Container auf 127.0.0.1:8086 (docker-compose.prod.yml)
# Installation:
#   sudo cp deploy/nginx-fixkosten.conf /etc/nginx/sites-available/fixkosten
#   sudo ln -s /etc/nginx/sites-available/fixkosten /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fixkosten.guita.dev      # HTTPS + Weiterleitung
server {
  listen 80;
  listen [::]:80;
  server_name fixkosten.guita.dev;

  client_max_body_size 6m; # CSV-Import

  location / {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
