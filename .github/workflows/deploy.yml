name: Deploy Fixkosten to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend – build & test
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

      - name: Frontend – build & test
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (optional, mostly for info)
        uses: actions/checkout@v4

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        run: |
          ssh deploy@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            echo "Changing to project directory"
            cd /var/www/fixkosten

            echo "Fetching latest code"
            git fetch origin
            git reset --hard origin/main

            echo "Stopping existing containers"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true

            echo "Building and restarting in detached mode"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "Pruning dangling images"
            docker image prune -f

            echo "Waiting for API health"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8086/api/health > /dev/null; then
                echo "Deployment completed"
                exit 0
              fi
              sleep 2
            done
            echo "API not healthy" >&2
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 api
            exit 1
          EOF
