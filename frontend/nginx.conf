server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Backend (Docker-Compose-Service "api")
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m; # CSV-Import bis 5 MB
  }

  # Service Worker und Manifest immer frisch laden (sonst kommen Updates nicht an)
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Gehashte Build-Dateien lange cachen
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-Page-App: unbekannte Pfade auf index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
